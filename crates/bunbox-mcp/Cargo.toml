[package]
name = "bunbox-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
hex = "0.4"
microsandbox-agent-client = { version = "=0.7.2", features = ["uds"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std"] }

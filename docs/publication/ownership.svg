<svg viewBox="0 0 720 374" font-family="system-ui, sans-serif" role="img" aria-labelledby="d2-title d2-desc" xmlns="http://www.w3.org/2000/svg"><title id="d2-title">Who owns what when the worker disappears</title><desc id="d2-desc">Locus and Temporal retain the task and decisions. Replaceable UAR invokes the typed BunBox job. BunBox tracks execution and independent teardown. The file service verifies the final save separately.</desc><g fill="#172332"><rect x="30" y="18" width="660" height="70" rx="12"/><rect x="30" y="109" width="660" height="70" rx="12"/><rect x="30" y="200" width="660" height="70" rx="12"/><rect x="30" y="291" width="660" height="70" rx="12"/></g><g fill="#FF8B66" font-size="21" font-weight="700"><text x="48" y="60">Locus</text><text x="48" y="151">UAR</text><text x="48" y="242">BunBox</text><text x="48" y="333">File service</text></g><g fill="#E8EDF3" font-size="21"><text x="217" y="60">Identity, decisions and waiting work</text><text x="217" y="151">Scoped call from a replaceable run</text><text x="217" y="242">Bounded job, output and confirmed stop</text><text x="217" y="333">Authorized save and separate receipt</text></g><g stroke="#FF8B66" stroke-width="3" fill="none"><path d="M360 90v17m-6-6 6 6 6-6"/><path d="M360 181v17m-6-6 6 6 6-6"/><path d="M360 272v17m-6-6 6 6 6-6"/></g></svg>
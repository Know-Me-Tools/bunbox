<svg viewBox="0 0 720 260" font-family="system-ui, sans-serif" role="img" aria-labelledby="d1-title d1-desc" xmlns="http://www.w3.org/2000/svg"><title id="d1-title">A job is smaller than an account</title><desc id="d1-desc">The owner grants two selected files. The BunBox sandbox sees only task copies and generates a staged result. A separate authorized service verifies and saves the result.</desc><g fill="#172332"><rect x="22" y="23" width="205" height="196" rx="14"/><rect x="258" y="23" width="205" height="196" rx="14"/><rect x="494" y="23" width="205" height="196" rx="14"/></g><g fill="#FF8B66" font-size="19" font-weight="700"><text x="42" y="62">01 Select</text><text x="278" y="62">02 Compare</text><text x="514" y="62">03 Verify &amp; save</text></g><g fill="#E8EDF3" font-size="22"><text x="42" y="112">Two approved</text><text x="42" y="142">file versions</text><text x="278" y="112">One bounded</text><text x="278" y="142">private worker</text><text x="514" y="112">One exact output</text><text x="514" y="142">and receipt</text></g><g stroke="#FF8B66" stroke-width="3" fill="none"><path d="M232 121h20m-7-7 7 7-7 7"/><path d="M468 121h20m-7-7 7 7-7 7"/></g><g fill="#A7B0BC" font-size="15"><text x="42" y="185">Not a Drive mount</text><text x="278" y="185">Not UAR itself</text><text x="514" y="185">No automatic sharing</text></g></svg>